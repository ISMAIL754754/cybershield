<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#999"/></marker>
  </defs>
  <rect width="1100" height="640" fill="#fff"/>
  <text x="550" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">CyberShield – Architecture de la plateforme (réseau Docker : cybershield-net)</text>

  <!-- Source -->
  <rect x="30" y="90" width="150" height="90" rx="8" fill="#f1f1f1" stroke="#555"/>
  <text x="105" y="125" text-anchor="middle" font-size="14" font-weight="bold">CICIDS2017</text>
  <text x="105" y="145" text-anchor="middle" font-size="12">CSV (Kaggle)</text>
  <text x="105" y="162" text-anchor="middle" font-size="12">./data</text>

  <!-- Producer -->
  <rect x="230" y="90" width="150" height="90" rx="8" fill="#fde9c9" stroke="#c77700"/>
  <text x="305" y="125" text-anchor="middle" font-size="14" font-weight="bold">Producteur</text>
  <text x="305" y="145" text-anchor="middle" font-size="12">Python (rejeu CSV)</text>
  <text x="305" y="162" text-anchor="middle" font-size="12">JSON + event_id</text>

  <!-- Kafka -->
  <rect x="430" y="90" width="170" height="90" rx="8" fill="#dcebfa" stroke="#1f6fb5"/>
  <text x="515" y="125" text-anchor="middle" font-size="14" font-weight="bold">Kafka (KRaft)</text>
  <text x="515" y="145" text-anchor="middle" font-size="12">topic network-flows</text>
  <text x="515" y="162" text-anchor="middle" font-size="12">3 partitions</text>

  <text x="105" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#555">SOURCE</text>
  <text x="515" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#555">INGESTION</text>

  <!-- Spark cluster -->
  <rect x="400" y="230" width="460" height="190" rx="10" fill="#fff5f0" stroke="#d2531f" stroke-dasharray="6 4"/>
  <text x="630" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="#d2531f">CALCUL – Cluster Spark standalone</text>
  <rect x="420" y="270" width="130" height="60" rx="6" fill="#fbd5c4" stroke="#d2531f"/>
  <text x="485" y="296" text-anchor="middle" font-size="13" font-weight="bold">spark-master</text>
  <text x="485" y="314" text-anchor="middle" font-size="11">:7077 / UI :8080</text>
  <rect x="580" y="270" width="130" height="60" rx="6" fill="#fbd5c4" stroke="#d2531f"/>
  <text x="645" y="296" text-anchor="middle" font-size="13" font-weight="bold">spark-worker-1</text>
  <text x="645" y="314" text-anchor="middle" font-size="11">UI :8081</text>
  <rect x="725" y="270" width="125" height="60" rx="6" fill="#fbd5c4" stroke="#d2531f"/>
  <text x="787" y="296" text-anchor="middle" font-size="13" font-weight="bold">spark-worker-2</text>
  <text x="787" y="314" text-anchor="middle" font-size="11">UI :8082</text>
  <rect x="420" y="350" width="130" height="55" rx="6" fill="#fff" stroke="#d2531f"/>
  <text x="485" y="372" text-anchor="middle" font-size="12" font-weight="bold">Job archivage</text>
  <text x="485" y="390" text-anchor="middle" font-size="11">Kafka → Parquet</text>
  <rect x="580" y="350" width="130" height="55" rx="6" fill="#fff" stroke="#d2531f" stroke-dasharray="3 3"/>
  <text x="645" y="372" text-anchor="middle" font-size="12" font-weight="bold">Batch + Spark ML</text>
  <text x="645" y="390" text-anchor="middle" font-size="11">semaine 3</text>
  <rect x="725" y="350" width="125" height="55" rx="6" fill="#fff" stroke="#d2531f" stroke-dasharray="3 3"/>
  <text x="787" y="372" text-anchor="middle" font-size="12" font-weight="bold">Streaming ML</text>
  <text x="787" y="390" text-anchor="middle" font-size="11">semaine 4</text>

  <!-- HDFS -->
  <rect x="30" y="230" width="320" height="190" rx="10" fill="#eaf6ea" stroke="#2e8b2e" stroke-dasharray="6 4"/>
  <text x="190" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e8b2e">STOCKAGE – HDFS (réplication 2)</text>
  <rect x="120" y="268" width="140" height="50" rx="6" fill="#cfe9cf" stroke="#2e8b2e"/>
  <text x="190" y="290" text-anchor="middle" font-size="13" font-weight="bold">namenode</text>
  <text x="190" y="306" text-anchor="middle" font-size="11">:9000 / UI :9870</text>
  <rect x="45" y="345" width="130" height="55" rx="6" fill="#cfe9cf" stroke="#2e8b2e"/>
  <text x="110" y="368" text-anchor="middle" font-size="13" font-weight="bold">datanode1</text>
  <text x="110" y="385" text-anchor="middle" font-size="11">volume distinct</text>
  <rect x="205" y="345" width="130" height="55" rx="6" fill="#cfe9cf" stroke="#2e8b2e"/>
  <text x="270" y="368" text-anchor="middle" font-size="13" font-weight="bold">datanode2</text>
  <text x="270" y="385" text-anchor="middle" font-size="11">volume distinct</text>
  <line x1="165" y1="318" x2="125" y2="345" stroke="#2e8b2e"/>
  <line x1="215" y1="318" x2="255" y2="345" stroke="#2e8b2e"/>

  <!-- Restitution -->
  <rect x="400" y="480" width="460" height="110" rx="10" fill="#f3ecfa" stroke="#7a3db0" stroke-dasharray="6 4"/>
  <text x="630" y="502" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a3db0">RESTITUTION (semaine 4)</text>
  <rect x="425" y="520" width="190" height="55" rx="6" fill="#e3d2f3" stroke="#7a3db0" stroke-dasharray="3 3"/>
  <text x="520" y="544" text-anchor="middle" font-size="13" font-weight="bold">Base (PostgreSQL)</text>
  <text x="520" y="561" text-anchor="middle" font-size="11">prédictions + indicateurs</text>
  <rect x="650" y="520" width="190" height="55" rx="6" fill="#e3d2f3" stroke="#7a3db0" stroke-dasharray="3 3"/>
  <text x="745" y="544" text-anchor="middle" font-size="13" font-weight="bold">Tableau de bord</text>
  <text x="745" y="561" text-anchor="middle" font-size="11">Streamlit (bonus)</text>

  <!-- Flows -->
  <line x1="180" y1="135" x2="228" y2="135" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <line x1="380" y1="135" x2="428" y2="135" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <line x1="515" y1="180" x2="485" y2="348" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="520" y="215" font-size="11" fill="#333">readStream</text>
  <line x1="420" y1="378" x2="352" y2="378" stroke="#2e8b2e" stroke-width="2" marker-end="url(#a)"/>
  <text x="365" y="372" font-size="11" fill="#2e8b2e">Parquet</text>
  <path d="M600 140 C 880 140, 900 400, 852 395" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#g)"/>
  <text x="900" y="250" font-size="11" fill="#777">flux temps réel</text>
  <line x1="645" y1="405" x2="560" y2="520" stroke="#999" stroke-dasharray="5 4" marker-end="url(#g)"/>
  <line x1="787" y1="405" x2="745" y2="518" stroke="#999" stroke-dasharray="5 4" marker-end="url(#g)"/>
  <line x1="615" y1="548" x2="648" y2="548" stroke="#999" stroke-dasharray="5 4" marker-end="url(#g)"/>

  <path d="M190 420 C 190 455, 600 450, 630 407" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#g)"/>
  <text x="300" y="452" font-size="11" fill="#777">lecture historique</text>

  <!-- Legend -->
  <line x1="30" y1="560" x2="70" y2="560" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="80" y="564" font-size="12">Livré (semaines 1-2)</text>
  <line x1="30" y1="585" x2="70" y2="585" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#g)"/>
  <text x="80" y="589" font-size="12">Prévu (semaines 3-4)</text>
</svg>
